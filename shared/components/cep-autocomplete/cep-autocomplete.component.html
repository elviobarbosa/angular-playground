<mat-form-field class="example-full-width">
  <mat-label>CEP</mat-label>

  <input matInput placeholder="Digite o CEP" cepInputFormat baseAutocomplete [endpoint]="endpoint()" displayKey="key"
    [displayFn]="formatPixKeyDisplay" (optionSelected)="optionSelected.emit($event)" [formControl]="control()"
    [control]="control()" [matAutocomplete]="auto" #dir="baseAutocompleteApi" #autoInput
    (input)="setEndpoint(autoInput.value)" />

  <mat-autocomplete #auto="matAutocomplete" (optionSelected)="dir.onSelect($event)" [displayWith]="dir.format.bind(dir)"
    [displayWith]="dir.format.bind(dir)">
    @for (item of dir.results; track item.id) {
    <mat-option [value]="item">
      {{ dir.format(item) }}
    </mat-option>
    }
  </mat-autocomplete>
  @if (dir.shouldShowNoResults()) {
  <mat-hint>Nenhum resultado encontrado</mat-hint>
  }
</mat-form-field>
